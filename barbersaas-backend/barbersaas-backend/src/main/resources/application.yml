spring:
  application:
    name: barbersaas-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/barbersaas
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:sasbarberias@gmail.com}
    password: ${MAIL_PASSWORD:zdzi obvl xzsl zxat}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_PRODUCTION_MIN_256_BITS_LONG_KEY_0123456789}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.barbersaas: DEBUG
    org.hibernate.SQL: DEBUG

fcm:
  credentials-path: ${FCM_CREDENTIALS_PATH:}

app:
  mail:
    from: sasbarberias@gmail.com
  upload-dir: ${UPLOAD_DIR:./uploads}