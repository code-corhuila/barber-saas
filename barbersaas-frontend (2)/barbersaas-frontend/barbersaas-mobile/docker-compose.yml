services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: barbersaas-frontend-dev
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:8080
    container_name: barbersaas-frontend-web
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  frontend_node_modules:
