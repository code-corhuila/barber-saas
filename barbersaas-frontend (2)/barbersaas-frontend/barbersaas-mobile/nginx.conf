server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html NUNCA se cachea: es lo que apunta al bundle JS con hash del
    # build actual. Cachearlo hacia que el navegador siguiera mostrando una
    # version vieja de la app despues de reconstruir el contenedor, aunque
    # el servidor ya sirviera codigo nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets exportados por Expo llevan un hash de contenido en el
    # nombre de archivo (ej. entry-abc123.js), asi que sí pueden cachearse
    # agresivamente: un cambio de codigo siempre produce un nombre nuevo.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Expo Router es una SPA del lado del cliente: toda ruta desconocida
    # cae de vuelta a index.html para que el router de React la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
